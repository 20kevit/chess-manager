{% extends "base.html" %}

{% block title %}ساخت پروفایل شطرنج{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 600px; margin: 20px auto;">
    <h2 class="section-title">ساخت پروفایل جدید</h2>
    
    <form method="POST" action="{{ url_for('dashboard.create_profile') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="form-row">
            <div class="form-group col-md-6">
                <label>نام *</label>
                <input type="text" name="first_name" class="form-control" required>
            </div>
            <div class="form-group col-md-6">
                <label>نام خانوادگی *</label>
                <input type="text" name="last_name" class="form-control" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group col-md-6">
                <label>کد ملی (برای تایید رده سنی)</label>
                <input type="text" name="national_id" class="form-control" maxlength="10">
            </div>
            <div class="form-group col-md-6">
                <label>کد فیده (اختیاری)</label>
                <input type="text" name="fide_id" class="form-control">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group col-md-6">
                <label>تاریخ تولد</label>
                <input type="date" name="birth_date" class="form-control">
            </div>
            <div class="form-group col-md-6">
                <label>جنسیت</label>
                <select name="gender" class="form-control">
                    <option value="M">آقا</option>
                    <option value="F">خانم</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group col-md-6">
                <label>فدراسیون</label>
                <input type="text" name="federation" class="form-control" value="IRI">
            </div>
            <div class="form-group col-md-6">
                <label>عنوان فیده</label>
                <select name="fide_title" class="form-control">
                    <option value="">ندارم</option>
                    {% for t in ['GM', 'IM', 'FM', 'CM', 'WGM', 'WIM', 'WFM', 'WCM'] %}
                        <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <hr style="margin: 20px 0;">
        <h4>اطلاعات بانکی (برای واریز جوایز)</h4>
        <div class="form-row">
            <div class="form-group col-md-6">
                <label>شماره کارت (۱۶ رقمی)</label>
                <input type="text" name="bank_card_number" class="form-control" maxlength="16">
            </div>
            <div class="form-group col-md-6">
                <label>نام صاحب حساب</label>
                <input type="text" name="bank_account_name" class="form-control">
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-3">ایجاد پروفایل</button>
    </form>
</div>
{% endblock %}
