{% extends "base.html" %}

{% block title %}ورود به سیستم{% endblock %}

{% block content %}
<div class="form-container narrow">
    <h1 class="page-title" style="margin-bottom:4px">ورود به حساب کاربری</h1>
    <p class="page-desc" style="margin-bottom:16px">برای مدیریت تورنومنت‌ها وارد شوید.</p>

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="email">ایمیل</label>
            <input type="email" id="email" name="email" required autofocus autocomplete="email" dir="ltr">
        </div>

        <div class="field">
            <label for="password">رمز عبور</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-block">ورود</button>
        </div>
    </form>

    <p class="mt-3 text-center">
        حساب کاربری ندارید؟ <a href="{{ url_for('auth.register') }}">ثبت‌نام کنید</a>
    </p>
</div>
{% endblock %}
