{% extends "base.html" %}

{% block title %}ثبت‌نام در سیستم{% endblock %}

{% block content %}
<div class="form-container narrow">
    <h1 class="page-title" style="margin-bottom:4px">ایجاد حساب کاربری</h1>
    <p class="page-desc" style="margin-bottom:16px">ثبت‌نام در سامانه مدیریت تورنومنت.</p>

    <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="email">ایمیل</label>
            <input type="email" id="email" name="email" required autofocus autocomplete="email" dir="ltr">
        </div>

        <div class="field">
            <label for="password">رمز عبور (حداقل ۸ کاراکتر)</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        </div>

        <div class="field">
            <label for="password_confirm">تکرار رمز عبور</label>
            <input type="password" id="password_confirm" name="password_confirm" required minlength="8" autocomplete="new-password">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-block">ثبت‌نام</button>
        </div>
    </form>

    <p class="mt-3 text-center">
        قبلاً ثبت‌نام کرده‌اید؟ <a href="{{ url_for('auth.login') }}">وارد شوید</a>
    </p>
</div>
{% endblock %}
