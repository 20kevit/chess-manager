{% extends "base.html" %}

{% block title %}ثبت‌نام در سیستم{% endblock %}

{% block content %}
<div class="form-container">
    <h2>ایجاد حساب کاربری جدید</h2>
    
    <form method="POST" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="form-group">
            <label for="email">ایمیل:</label>
            <input type="email" id="email" name="email" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password">رمز عبور (حداقل ۸ کاراکتر):</label>
            <input type="password" id="password" name="password" required minlength="8">
        </div>
        
        <div class="form-group">
            <label for="password_confirm">تکرار رمز عبور:</label>
            <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
        </div>

        <button type="submit" class="btn btn-success">ثبت‌نام</button>
    </form>
    
    <p class="mt-3">
        قبلاً ثبت‌نام کرده‌اید؟ <a href="{{ url_for('auth.login') }}">وارد شوید</a>
    </p>
</div>
{% endblock %}
