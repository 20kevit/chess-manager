{% extends "base.html" %}
{% block title %}اعلان مسابقه | {{ tournament.name }}{% endblock %}

{% block content %}
<div class="page-header" style="margin-bottom: 25px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>📣 اعلان مسابقه</h1>
        <a href="{{ url_for('dashboard.manage_tournament', public_id=tournament.public_id) }}" class="btn btn-secondary">🔙 بازگشت به پنل مدیریت</a>
    </div>
</div>

<div class="form-container" style="max-width: 760px; border:none; background:#f8fafc; padding:30px; border-radius:15px;">
    <form method="POST" action="{{ url_for('tournament.announcements', public_id=tournament.public_id) }}">
        <div class="form-group">
            <label>متن اعلان (برای <strong>{{ recipient_count }}</strong> شرکت‌کننده دارای حساب ارسال می‌شود)</label>
            <textarea name="message" rows="6" required placeholder="مثال: زمان قرعه‌کشی دور دوم تغییر کرد...">{{ request.form.get('message', '') }}</textarea>
        </div>
        <p style="font-size:0.8rem; color:#94a3b8;">
            اعلان به‌صورت پیام داخلی و بر اساس تنظیمات هر کاربر از طریق تلگرام/بله نیز ارسال می‌شود. این سرویس رایگان است.
        </p>
        <button type="submit" class="btn btn-primary" style="padding:12px 35px;">📣 ارسال اعلان</button>
    </form>
</div>
{% endblock %}
